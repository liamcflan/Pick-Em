[project]
name = "pickem-jobs"
version = "0.1.0"
description = "Data-pull jobs for Pick-Em (schedule import, spread lock, score sync). Deployed as Vercel Python functions from api/."
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28",
  "supabase>=2.0",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["node_modules", ".next", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
pythonpath = ["."]
addopts = "-q"
