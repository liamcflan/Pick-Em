version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: tuesday }
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
  - package-ecosystem: uv
    directory: /
    schedule: { interval: weekly, day: tuesday }
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: tuesday }
