name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 6 * * 1"

permissions:
  security-events: write
  actions: read # codeql-action reads the workflow run to attach results
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@v3
        # The repository is public with Code Scanning enabled, so uploads succeed and findings
        # block the release PR. If it ever goes private again, set this back to true: uploads
        # are refused on private personal-account repos and would turn CI red.
        continue-on-error: false
        with:
          category: /language:${{ matrix.language }}
