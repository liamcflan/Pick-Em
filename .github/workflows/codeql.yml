name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 6 * * 1"

permissions:
  security-events: write
  actions: read # codeql-action reads the workflow run to attach results
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v3
        # GitHub only offers code-scanning uploads to organization accounts, so on this
        # personal-account repo the upload is refused even though the analysis itself runs.
        # Keep the scan informational (results are in the job log) rather than failing CI.
        # Flip this to false if the repo ever moves to an organization with Advanced Security.
        continue-on-error: true
        with:
          category: /language:${{ matrix.language }}
