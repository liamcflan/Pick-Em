name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 6 * * 1"

permissions:
  security-events: write
  actions: read # codeql-action reads the workflow run to attach results
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v3
        # Uploading results requires "Code scanning" to be enabled under
        # Settings → Code security. Until it is, the scan still runs but a refused
        # upload must not turn the release PR red. Remove this line once enabled.
        continue-on-error: true
        with:
          category: /language:${{ matrix.language }}
