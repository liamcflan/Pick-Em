name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 6 * * 1"

permissions:
  security-events: write
  actions: read # codeql-action reads the workflow run to attach results
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v3
        # Code scanning uploads are refused on private repositories, so the scan must not
        # turn the release PR red while the repo is private. The moment it goes public
        # (github.event.repository.private becomes false) findings block the merge.
        continue-on-error: ${{ github.event.repository.private != false }}
        with:
          category: /language:${{ matrix.language }}
